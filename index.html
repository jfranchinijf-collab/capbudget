<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap Budget</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bleu:#1e3a8a; --cyan:#06b6d4; --soleil:#fbbf24; --fond:#f8fafc; --texte:#0f172a; --gris:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--fond); color:var(--texte); }
  .ecran:not(.actif) { display:none !important; }
  body:not(.mode-perso) .perso-seul { display:none !important; }
  #accueil { min-height:100vh; background:linear-gradient(135deg,var(--bleu) 0%,#4338ca 45%,var(--cyan) 100%); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px; position:relative; }
  #accueil .langue { position:absolute; top:16px; right:16px; }
  .logo { width:96px; height:96px; margin-bottom:12px; }
  #accueil h1 { font-size:52px; margin:0; letter-spacing:-1px; }
  #accueil p.accroche { font-size:20px; opacity:.92; max-width:560px; margin:14px auto 32px; }
  .btn { border:0; border-radius:14px; padding:16px 28px; font-size:18px; font-weight:600; cursor:pointer; margin:8px; }
  .btn-primaire { background:var(--soleil); color:var(--texte); }
  .btn-second { background:rgba(255,255,255,.15); color:#fff; border:2px solid rgba(255,255,255,.6); }
  .btn-petit { padding:8px 14px; font-size:14px; border-radius:10px; }
  .atouts { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin-top:40px; }
  .atout { background:rgba(255,255,255,.12); border-radius:16px; padding:18px 22px; width:220px; }
  .atout b { display:block; font-size:18px; margin-bottom:6px; }
  header { background:var(--bleu); color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h2 { margin:0; font-size:22px; display:flex; align-items:center; gap:8px; } header h2 img { width:32px; height:32px; } header .espace { flex:1; }
  main { max-width:1100px; margin:0 auto; padding:20px; }
  .cartes { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:20px; }
  .carte { background:#fff; border-radius:16px; padding:18px; box-shadow:0 4px 14px rgba(15,23,42,.06); }
  .carte .libelle { color:var(--gris); font-size:14px; } .carte .valeur { font-size:28px; font-weight:700; margin-top:4px; }
  .revenu { color:#059669; } .depense { color:#e11d48; }
  .grille { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:800px){ .grille { grid-template-columns:1fr; } }
  select, input[type=text], input[type=number] { padding:8px 10px; border-radius:10px; border:1px solid #cbd5e1; font-size:15px; }
  input[type=number] { width:110px; }
  .bascule { display:inline-flex; background:#e2e8f0; border-radius:10px; overflow:hidden; }
  .bascule button { border:0; padding:8px 14px; background:transparent; cursor:pointer; font-weight:600; color:var(--gris); }
  .bascule button.on { background:var(--bleu); color:#fff; }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal.actif { display:flex; } .modal .carte { max-width:560px; width:100%; max-height:90vh; overflow:auto; }
  .tag { display:inline-block; background:#e0f2fe; color:var(--bleu); border-radius:999px; padding:2px 10px; font-size:12px; margin:2px; }
  .ligne-budget { padding:10px 0; border-bottom:1px solid #e2e8f0; }
  .ligne-budget .haut { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
  .barre { height:10px; border-radius:6px; background:#e2e8f0; overflow:hidden; margin:6px 0 2px; } .barre div { height:10px; border-radius:6px; }
  .petit { font-size:12px; color:var(--gris); margin:0; }
  .choix-profil { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .choix-profil button { border:2px solid #e2e8f0; background:#fff; border-radius:14px; padding:18px 12px; cursor:pointer; text-align:left; font-size:16px; }
  .choix-profil button:hover { border-color:var(--cyan); }
  .ligne-verif { display:grid; grid-template-columns:auto minmax(0,1fr) 96px; gap:6px 8px; align-items:center; padding:10px 0; border-bottom:1px solid #e2e8f0; }
  .ligne-verif input[type=checkbox] { width:22px; height:22px; }
  .ligne-verif input[type=date] { padding:7px 4px; border-radius:10px; border:1px solid #cbd5e1; font-size:13px; min-width:0; width:100%; }
  .ligne-verif input[type=number] { width:100%; text-align:right; font-weight:600; }
  .ligne-verif input[type=text] { grid-column:2 / 4; width:100%; }
  .bandeau-demo { background:#fef3c7; color:#92400e; padding:10px 20px; font-size:14px; text-align:center; }
  .lien-conf { margin-top:36px; font-size:13px; } .lien-conf a { color:#fff; opacity:.85; }
  .choix-profil b { display:block; margin-bottom:4px; color:var(--bleu); } .choix-profil span { font-size:13px; color:var(--gris); }
</style>
</head>
<body>

<section id="accueil" class="ecran actif">
  <select class="langue" onchange="setLangue(this.value)" aria-label="Langue"></select>
  <img class="logo" src="icone-192.png" alt="Logo Cap Budget">
  <h1>Cap Budget</h1>
  <p class="accroche" data-t="accroche"></p>
  <div>
    <button class="btn btn-primaire" onclick="lancer('import')" data-t="importer"></button>
    <button class="btn btn-second" onclick="lancer('demo')" data-t="demo"></button>
  </div>
  <div class="atouts">
    <div class="atout"><b data-t="a1t"></b><span data-t="a1"></span></div>
    <div class="atout"><b data-t="a2t"></b><span data-t="a2"></span></div>
    <div class="atout"><b data-t="a3t"></b><span data-t="a3"></span></div>
    <div class="atout"><b data-t="a4t"></b><span data-t="a4"></span></div>
  </div>
  <p class="lien-conf"><a href="confidentialite.html" data-t="confidentialite"></a></p>
</section>

<section id="app" class="ecran">
  <header>
    <h2><img src="icone-192.png" alt=""> Cap Budget</h2>
    <select id="selProfil" onchange="setProfil(this.value)" aria-label="Profil"></select>
    <select id="selMois" onchange="afficher()" aria-label="Mois"></select>
    <div class="bascule"><button id="bCam" class="on" onclick="setVue('camembert')" data-t="camemberts"></button><button id="bBar" onclick="setVue('barres')" data-t="barres"></button></div>
    <div class="espace"></div>
    <select class="langue" onchange="setLangue(this.value)" aria-label="Langue"></select>
    <label class="btn btn-primaire btn-petit" style="position:relative"><span data-t="importerCsv"></span><input id="fichier" type="file" multiple accept=".csv,.txt,text/csv,text/plain,text/comma-separated-values,application/csv,application/vnd.ms-excel,.pdf,application/pdf,image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden" onchange="importerFichiers(this.files)"></label>
    <button class="btn btn-second btn-petit perso-seul" onclick="ouvrirBudgets()" data-t="budgets"></button>
    <button class="btn btn-second btn-petit" onclick="ouvrirReglages()" data-t="categories"></button>
    <button class="btn btn-second btn-petit" onclick="toutEffacer()" data-t="effacer"></button>
  </header>
  <div id="bandeauDemo" class="bandeau-demo" data-t="demoBandeau" hidden></div>
  <main>
    <div class="cartes">
      <div class="carte"><div class="libelle" data-t="kRev"></div><div class="valeur revenu" id="kRev">–</div></div>
      <div class="carte"><div class="libelle" data-t="kDep"></div><div class="valeur depense" id="kDep">–</div></div>
      <div class="carte"><div class="libelle" data-t="kRes"></div><div class="valeur" id="kRes">–</div></div>
      <div class="carte"><div class="libelle" data-t="kNb"></div><div class="valeur" id="kNb">–</div></div>
    </div>
    <div class="grille perso-seul" style="margin-bottom:16px">
      <div class="carte"><h3 data-t="suivi"></h3><div id="listeSuivi"></div></div>
      <div class="carte"><h3 data-t="epargne"></h3><div id="listeEpargne"></div></div>
    </div>
    <div class="grille">
      <div class="carte"><h3 data-t="gDep"></h3><canvas id="gDep"></canvas></div>
      <div class="carte"><h3 data-t="gRev"></h3><canvas id="gRev"></canvas></div>
    </div>
    <div class="carte" style="margin-top:16px"><h3 data-t="gAnnee"></h3><canvas id="gAnnee" height="110"></canvas></div>
  </main>
</section>

<!-- Choix du profil au premier lancement -->
<div id="mProfil" class="modal"><div class="carte">
  <h3 data-t="choixTitre"></h3>
  <p class="petit" data-t="choixAide"></p>
  <div class="choix-profil">
    <button onclick="choisirProfil('pro')"><b data-t="pro"></b><span data-t="proD"></span></button>
    <button onclick="choisirProfil('perso')"><b data-t="perso"></b><span data-t="persoD"></span></button>
  </div>
</div></div>

<!-- Budgets et épargne (mode particulier) -->
<div id="mBudgets" class="modal"><div class="carte">
  <h3 data-t="budgets"></h3>
  <p class="petit" data-t="aideBudg"></p>
  <div id="listePlafonds" style="max-height:35vh;overflow:auto"></div>
  <h3 data-t="epargne"></h3>
  <div id="listeObjectifs"></div>
  <p><input type="text" id="objNom"> <input type="number" id="objCible" min="0" step="50"> <button class="btn btn-primaire btn-petit" onclick="ajouterObjectif()" data-t="ajouter"></button></p>
  <p><button class="btn btn-petit" style="background:var(--bleu);color:#fff" onclick="fermerBudgets()" data-t="fermer"></button></p>
</div></div>

<!-- Lecture d'un PDF ou d'une photo en cours -->
<div id="mAttente" class="modal"><div class="carte" style="text-align:center">
  <p id="txtAttente" style="font-weight:600"></p>
  <p class="petit" data-t="lectureAide"></p>
</div></div>

<!-- Vérification des opérations lues dans un PDF ou une photo -->
<div id="mVerif" class="modal"><div class="carte" style="max-width:820px">
  <h3 data-t="verifTitre"></h3>
  <p class="petit" data-t="verifAide"></p>
  <div style="max-height:55vh;overflow:auto;margin:12px 0">
    <div id="listeVerif"></div>
  </div>
  <p><button class="btn btn-primaire btn-petit" onclick="validerVerif()" data-t="importerSel"></button>
  <button class="btn btn-petit" style="background:#e2e8f0;color:var(--texte)" onclick="document.getElementById('mVerif').classList.remove('actif')" data-t="annuler"></button></p>
</div></div>

<!-- Catégories -->
<div id="mReglages" class="modal"><div class="carte">
  <h3 data-t="titreCat"></h3>
  <p style="color:var(--gris)" data-t="aideCat"></p>
  <div id="listeCat" style="max-height:50vh;overflow:auto"></div>
  <p><input type="text" id="nvNom"> <select id="nvType"></select> <button class="btn btn-primaire btn-petit" onclick="ajouterCat()" data-t="ajouter"></button></p>
  <p><button class="btn btn-primaire btn-petit" onclick="fusionner()" data-t="fusionner"></button>
  <button class="btn btn-petit" style="background:var(--bleu);color:#fff" onclick="fermer()" data-t="fermer"></button></p>
</div></div>

<!-- Messages de l'appli (remplacent les fenêtres du navigateur, parfois bloquées) -->
<div id="mMessage" class="modal" style="z-index:20"><div class="carte" style="max-width:440px">
  <p id="txtMessage" style="font-size:16px;line-height:1.5"></p>
  <p id="zoneSaisie"></p>
  <p><button id="bOk" class="btn btn-primaire btn-petit">OK</button> <button id="bAnnuler" class="btn btn-petit" style="background:#e2e8f0;color:var(--texte)"></button></p>
</div></div>

// ---------- Messages (à la place de alert, confirm et prompt) ----------
function message(txt) { return boite(txt, false); }
function boite(txt, avecAnnuler, saisie) {
  return new Promise(ok => {
    const m = document.getElementById('mMessage'), zone = document.getElementById('zoneSaisie');
    document.getElementById('txtMessage').textContent = txt;
    zone.innerHTML = ''; let champ = null;
    if (saisie !== undefined && saisie !== null) { champ = document.createElement('input'); champ.type = 'text'; champ.value = saisie; champ.style.width = '100%'; zone.appendChild(champ); }
    const bOk = document.getElementById('bOk'), bAn = document.getElementById('bAnnuler');
    bAn.textContent = t('annuler'); bAn.style.display = avecAnnuler ? '' : 'none';
    const fin = v => { m.classList.remove('actif'); bOk.onclick = bAn.onclick = null; ok(v); };
    bOk.onclick = () => fin(champ ? champ.value.trim() : true);
    bAn.onclick = () => fin(champ ? null : false);
    m.classList.add('actif'); (champ || bOk).focus();

}

async function toutEffacer() { if (await boite(t('confirmer'), true)) { try { localStorage.removeItem('capbudget'); } catch (e) {} location.reload(); } }

// ---------- Import : CSV, PDF et photos (plusieurs fichiers à la fois) ----------
const estPdf = f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
const estImage = f => /\.(jpe?g|png|webp|heic|bmp|gif)$/i.test(f.name) || /^image\//.test(f.type);
async function importerFichiers(liste) {
  const fichiers = [...(liste || [])];
  document.getElementById('fichier').value = '';
  if (!fichiers.length) return;
  // 1. Les CSV : lecture directe.
  for (const f of fichiers.filter(f => !estPdf(f) && !estImage(f))) importerTexte(await lireTexte(f));
  // 2. Les PDF et les photos : lecture du texte, puis vérification par l'utilisateur.
  const autres = fichiers.filter(f => estPdf(f) || estImage(f));
  if (!autres.length) return;
  let ops = [];
  try {
    for (let k = 0; k < autres.length; k++) {
      attente(`${t('lecture')} ${k + 1} / ${autres.length}`);
      const lignes = estPdf(autres[k]) ? await lignesPdf(autres[k]) : await lignesImage(autres[k]);
      ops = ops.concat(analyserLignes(lignes));
    }
  } catch (e) { attente(''); message(t('errLecture')); return; }
  attente('');
  // Les captures qui se chevauchent montrent deux fois la même opération : on n'en garde qu'une.
  const vus = new Set();
  ops = ops.filter(o => { const k = o.date + '|' + o.libelle + '|' + o.montant; if (vus.has(k)) return false; vus.add(k); return true; });
  if (!ops.length) { message(t('aucuneLue')); return; }
  ouvrirVerif(ops);
}
function lireTexte(f) {
  return new Promise(ok => {
    const r = new FileReader();
    r.onload = e => {
      // Lit le fichier en UTF-8, ou en Windows-1252 (accents des banques françaises) si besoin.
      const octets = new Uint8Array(e.target.result);
      try { ok(new TextDecoder('utf-8', {fatal: true}).decode(octets)); } catch (err) { ok(new TextDecoder('windows-1252').decode(octets)); }
    };
    r.readAsArrayBuffer(f);
  });
}
function attente(msg) { document.getElementById('txtAttente').textContent = msg || ''; document.getElementById('mAttente').classList.toggle('actif', !!msg); }
function chargerScript(src) {
  return new Promise((ok, ko) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s);
  });
}
const LIBS = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  ocr: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'
};
// PDF : récupère le texte de chaque page, ligne par ligne, avec la position horizontale de chaque mot.
async function lignesPdf(f) {
  await chargerScript(LIBS.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  const doc = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
  const lignes = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const contenu = await (await doc.getPage(p)).getTextContent();
    const parY = [];
    contenu.items.forEach(it => {
      if (!it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      let l = parY.find(l => Math.abs(l.y - y) < 3);
      if (!l) { l = {y, items: []}; parY.push(l); }
      l.items.push({str: it.str.trim(), x, w: it.width || 0});
    });
    parY.sort((a, b) => b.y - a.y).forEach(l => { l.items.sort((a, b) => a.x - b.x); lignes.push({texte: l.items.map(i => i.str).join(' '), items: l.items}); });
  }
  return lignes;
}
// Photo ou capture d'écran : reconnaissance du texte, directement dans le navigateur (l'image n'est envoyée nulle part).
async function lignesImage(f) {
  await chargerScript(LIBS.ocr);
  const w = await Tesseract.createWorker('fra');
  const { data } = await w.recognize(f);
  await w.terminate();
  // Couleur de chaque mot : dans beaucoup d'applis bancaires, les crédits sont écrits en vert.
  let ctx = null;
  try {
    const img = await createImageBitmap(f), c = document.createElement('canvas');
    c.width = img.width; c.height = img.height; ctx = c.getContext('2d', {willReadFrequently: true}); ctx.drawImage(img, 0, 0);
  } catch (e) {}
  const mots = (data.words || []).map(m => ({str: m.text, x0: m.bbox.x0, x1: m.bbox.x1, y0: m.bbox.y0, y1: m.bbox.y1, vert: ctx ? estVert(ctx, m.bbox) : null}));
  return grouperMots(mots);
}
function estVert(ctx, b) {
  const w = Math.max(1, b.x1 - b.x0), h = Math.max(1, b.y1 - b.y0);
  const d = ctx.getImageData(b.x0, b.y0, w, h).data;
  // On ne regarde que les pixels du texte (les plus foncés) : vert si le vert domine nettement le rouge.
  let n = 0, r = 0, g = 0;
  for (let i = 0; i < d.length; i += 4) { if (d[i] + d[i + 1] + d[i + 2] < 450) { r += d[i]; g += d[i + 1]; n++; } }
  return n > 0 && (g - r) / n > 40;
}
// Regroupe les mots qui sont à la même hauteur sur l'image : le montant retrouve ainsi son libellé,
// même quand la lecture automatique a lu l'écran colonne par colonne.
function grouperMots(mots) {
  mots = mots.filter(m => m.str && m.str.trim());
  // Hauteur habituelle d'un mot : les icônes et les éléments plus grands ne doivent pas fusionner plusieurs lignes.
  const hauteurs = mots.map(m => m.y1 - m.y0).sort((a, b) => a - b), hType = hauteurs[Math.floor(hauteurs.length / 2)] || 10;
  const rangs = [];
  mots.filter(m => m.y1 - m.y0 <= hType * 2.5).sort((a, b) => (a.y0 + a.y1) - (b.y0 + b.y1)).forEach(m => {
    const yc = (m.y0 + m.y1) / 2;
    let r = rangs.find(r => Math.abs(r.yc - yc) < hType * 0.6);
    if (!r) { r = {yc, mots: []}; rangs.push(r); }
    r.mots.push(m);
  });
  return rangs.sort((a, b) => a.yc - b.yc).map(r => {
    r.mots.sort((a, b) => a.x0 - b.x0);
    return {texte: r.mots.map(m => m.str).join(' '), items: r.mots.map(m => ({str: m.str, x: m.x0, w: m.x1 - m.x0, vert: m.vert})), image: true};
  });
}
// Transforme des lignes de texte en opérations. Gère deux présentations :
// - un relevé PDF : « 06/10/2026  LIBELLÉ  170,61 » (débit ou crédit selon la colonne) ;
// - une capture de l'appli bancaire : « LIBELLÉ  -170,61 € », suite du libellé, puis « Lun. 05 oct. ».
function analyserLignes(lignes) {
  const sansAcc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const reMontant = /([+\-−–]?)\s?(\d{1,3}(?:[ \u00a0\u202f.]\d{3})*,\d{2})(?!\d)/g;
  const reDateNum = /\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{4}|\d{2}))?\b/g;
  const reDateMois = /\b(\d{1,2})\s+(janv|jan|fevr|fev|feb|mars|mar|avr|apr|mai|may|juin|jun|juil|jul|aout|aug|sept|sep|oct|nov|dec)[a-z]*\.?(?:\s+(\d{4}))?/;
  const MOIS = {janv:1, jan:1, fevr:2, fev:2, feb:2, mars:3, mar:3, avr:4, apr:4, mai:5, may:5, juin:6, jun:6, juil:7, jul:7, aout:8, aug:8, sept:9, sep:9, oct:10, nov:11, dec:12};
  const auj = new Date();
  const annee = (m, a) => a ? (a.length === 2 ? 2000 + +a : +a) : (m > auj.getMonth() + 1 ? auj.getFullYear() - 1 : auj.getFullYear());
  const iso = (j, m, a) => (j >= 1 && j <= 31 && m >= 1 && m <= 12) ? `${a}-${String(m).padStart(2, '0')}-${String(j).padStart(2, '0')}` : null;
  const valeur = s => parseFloat(s.replace(/[ \u00a0\u202f.]/g, '').replace(',', '.'));
  // Retire le symbole €, les petits signes parasites (icônes, flèches) et les espaces en trop.
  const nettoyer = s => s.replace(/^\s*\S{1,2}\s+(?=[A-Z]{3})/, '').replace(/\s+\d$/, '').replace(/€|EUR\b/gi, ' ').replace(/(^|\s)[^A-Za-z0-9À-ÿ\s]{1,3}(?=\s|$)/g, ' ').replace(/\s+/g, ' ').replace(/^[^A-Za-z0-9À-ÿ]+|[^A-Za-z0-9À-ÿ.)]+$/g, '').trim();
  // Colonnes « Débit » et « Crédit » d'un relevé, si on les trouve.
  const centre = i => i.x + (i.w || 0) / 2;
  let xDeb = null, xCred = null;
  const entete = lignes.find(l => /debit/.test(sansAcc(l.texte)) && /credit/.test(sansAcc(l.texte)) && l.items && l.items.length);
  if (entete) entete.items.forEach(i => { const s = sansAcc(i.str); if (/debit/.test(s) && xDeb === null) xDeb = centre(i); if (/credit/.test(s) && xCred === null) xCred = centre(i); });
  // Signe d'après la couleur du montant sur une photo (vert = crédit), quand le + ou le - n'a pas été lu.
  const signeCouleur = (l, m) => {
    if (!l.image || !l.items) return '';
    const fin = m[2].slice(-3), item = l.items.find(i => i.str.includes(fin) && i.vert !== null && i.vert !== undefined);

  const motsCredit = /(euro vir|vir(ement)? (recu|sepa recu|de )|remise|salaire|versement|avoir|rembours)/i;

    if (!t0) continue;

    const dm = sansAcc(t0).match(reDateMois);

          const mi = [...proche.str.matchAll(reMontant)].pop();
          if (mi) m = mi;
          signe = Math.abs(centre(proche) - xCred) < Math.abs(centre(proche) - xDeb) ? '+' : '-';

      }
      let lib = t0; montants.forEach(x => lib = lib.replace(x[0], ' ')); lib = nettoyer(lib.replace(reDateNum, ' '));
      if (!signe) signe = signeCouleur(l, m) || (motsCredit.test(lib) ? '+' : '-');
      ops.push({date: datesNum[0], libelle: lib, montant: (signe === '+' ? 1 : -1) * valeur(m[2])});
      bloc = null;
    } else if (montants.length && (/[+\-−–]/.test(montants[montants.length - 1][1]) || (signeCouleur(l, montants[montants.length - 1]) && nettoyer(t0.replace(montants[montants.length - 1][0], ' ')).replace(/[^A-Za-z]/g, '').length > 2))) {
      // Capture de l'appli : libellé et montant (signé ou coloré), la date suit plus bas.
      const m = montants[montants.length - 1];
      const signe = /[+\-−–]/.test(m[1]) ? (m[1] === '+' ? '+' : '-') : signeCouleur(l, m);
      let lib = nettoyer(t0.replace(m[0], ' '));
      if (!lib) lib = precedent;
      bloc = {date: null, libelle: lib, montant: (signe === '+' ? 1 : -1) * valeur(m[2])};
      if (dateMois) { bloc.date = dateMois; ops.push(bloc); bloc = null; }
    } else if (bloc && (dateMois || datesNum.length)) {
      bloc.date = dateMois || datesNum[0]; ops.push(bloc); bloc = null;
    } else if (bloc && !montants.length && /^[A-Z0-9 .,'&\-\/]+$/.test(nettoyer(t0)) && nettoyer(t0) && bloc.libelle.length < 60) {

}
let aVerifier = [];

    <input type="number" step="0.01" value="${o.montant}" aria-label="${t('colMontant')}" class="${o.montant >= 0 ? 'revenu' : 'depense'}" onchange="aVerifier[${i}].montant = parseFloat(this.value) || 0; this.className = aVerifier[${i}].montant >= 0 ? 'revenu' : 'depense'">
    <span></span><input type="text" value="${esc(o.libelle)}" aria-label="${t('colLib')}" onchange="aVerifier[${i}].libelle = this.value"></div>`).join('');

function validerVerif() {
  const choisis = [...document.querySelectorAll('.vCoche')].filter(c => c.checked).map(c => aVerifier[+c.dataset.i]);
  let n = 0;
  choisis.forEach(o => {
    if (!o.date || !o.montant) return;
    if (etat.operations.some(x => x.date === o.date && x.libelle === o.libelle && x.montant === o.montant)) return;
    etat.operations.push({date: o.date, libelle: o.libelle, montant: o.montant, cat: null}); n++;
  });
  document.getElementById('mVerif').classList.remove('actif');

}
function importerTexte(txt, silencieux) {
  let lignes = txt.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  // Saute les lignes d'en-tête de la banque (nom du compte, solde...) jusqu'à la ligne des titres de colonnes.
  const iEnt = lignes.findIndex(l => /date|fecha|datum|data/i.test(l) && /libell|label|descri|intitul|concepto|buchungstext|verwendung|causale|movimento|montant|amount|d[ée]bit/i.test(l));
  if (iEnt > 0) lignes = lignes.slice(iEnt);
  if (lignes.length < 2) { if (!silencieux) message(t('rien')); return; }
  const sep = [';', ',', '\t'].sort((a, b) => lignes[0].split(b).length - lignes[0].split(a).length)[0];
  // Découpe une ligne en respectant les guillemets ("1 234,56" ne doit pas être coupé).
  const decoupe = l => { const res = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { res.push(cur.trim()); cur = ''; } else cur += ch; } res.push(cur.trim()); return res; };
  const entete = decoupe(lignes[0]).map(h => h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
  const col = (...n) => entete.findIndex(h => n.some(x => h.includes(x)));
  const iDate = col('date', 'fecha', 'datum', 'data'), iLib = col('libell', 'label', 'descri', 'intitul', 'concepto', 'buchungstext', 'verwendung', 'causale', 'movimento');
  const iMont = col('montant', 'amount', 'importe', 'importo', 'betrag', 'valor'), iDeb = col('debit', 'cargo', 'uscite', 'soll'), iCred = col('credit', 'abono', 'entrate', 'haben');
  const nombre = s => { s = (s || '0').replace(/[\s€+]/g, ''); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, ''); return parseFloat(s) || 0; };
  const date = s => { const m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; const iso = s.match(/\d{4}-\d{2}-\d{2}/); return iso ? iso[0] : null; };
  let n = 0;
  lignes.slice(1).forEach(l => {
    const c = decoupe(l), d = date(c[iDate] || ''); if (!d) return;
    const montant = iMont >= 0 ? nombre(c[iMont]) : nombre(c[iCred]) - Math.abs(nombre(c[iDeb]));
    const op = {date:d, libelle:c[iLib] || '', montant, cat:null};
    if (etat.operations.some(o => o.date === op.date && o.libelle === op.libelle && o.montant === op.montant)) return;
    etat.operations.push(op); n++;
  });
  classerTout(); sauver(); remplirMois(); afficher();
  if (!silencieux) message(n ? n + ' ' + t('importees') : t('rien'));
}

// ---------- Création automatique des catégories ----------
// Retire les préfixes bancaires et les numéros pour retrouver le bénéficiaire.
const PREFIXES = /^(PRLV SEPA|PRLV INT ETS|PRLV|EURO VIR|VIR INST|VIR SEPA|VIR|CARTE|CB|ADEUDO|RECIBO|TRANSFERENCIA|BONIFICO|ADDEBITO|LASTSCHRIFT|ÜBERWEISUNG|GUTSCHRIFT|TRF|DD|SO|PAGAMENTO)\s+/i;
function cleDe(libelle) {
  let s = libelle.toUpperCase().replace(/\./g, '').replace(/\d+/g, ' ').replace(/[*\/]/g, ' ').replace(/\s+/g, ' ').trim();
  for (let i = 0; i < 3; i++) s = s.replace(PREFIXES, '');
  return s.split(' ').filter(m => m.length > 1).slice(0, 3).join(' ') || libelle.slice(0, 20);
}
const joli = s => s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
function classer(op) {
  const lib = op.libelle.toUpperCase(), type = op.montant >= 0 ? 'revenu' : 'depense';
  let cat = etat.categories.find(c => c.type === type && c.mots.some(m => lib.includes(m.toUpperCase())));
  if (!cat) { const cle = cleDe(op.libelle); cat = {nom:joli(cle), type, mots:[cle], auto:true}; etat.categories.push(cat); }
  op.cat = cat.nom;
}
function classerTout() { etat.operations.forEach(classer); }

// ---------- Affichage ----------
function remplirMois() {
  let mois = [...new Set(etat.operations.map(o => o.date.slice(0, 7)))].sort().reverse();
  if (DEMO) mois = mois.slice(0, 1); // démo : seul le dernier mois importé
  const sel = document.getElementById('selMois'), avant = sel.value;
  sel.innerHTML = mois.map(m => `<option value="${m}">${new Date(m + '-01').toLocaleDateString(LOCALE[etat.langue], {month:'long', year:'numeric'})}</option>`).join('');
  if (mois.includes(avant)) sel.value = avant;
}
function setVue(v) { vue = v; document.getElementById('bCam').classList.toggle('on', v === 'camembert'); document.getElementById('bBar').classList.toggle('on', v === 'barres'); afficher(); }
function afficher() {
  if (!document.getElementById('app').classList.contains('actif')) return;
  const mois = document.getElementById('selMois').value, ops = etat.operations.filter(o => o.date.startsWith(mois));
  const rev = ops.filter(o => o.montant > 0), dep = ops.filter(o => o.montant < 0);
  const tRev = rev.reduce((s, o) => s + o.montant, 0), tDep = -dep.reduce((s, o) => s + o.montant, 0);
  document.getElementById('kRev').textContent = eur(tRev); document.getElementById('kDep').textContent = eur(tDep);
  const res = document.getElementById('kRes'); res.textContent = eur(tRev - tDep); res.className = 'valeur ' + (tRev >= tDep ? 'revenu' : 'depense');
  document.getElementById('kNb').textContent = ops.length;
  if (window.Chart) { dessiner('gDep', agreger(dep)); dessiner('gRev', agreger(rev)); dessinerAnnee((mois || '2026').slice(0, 4)); }
  if (etat.profil === 'perso') afficherBudgets(dep);
}
function agreger(ops) { const m = {}; ops.forEach(o => m[o.cat] = (m[o.cat] || 0) + Math.abs(o.montant)); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function dessiner(id, d) {
  if (graphes[id]) graphes[id].destroy();
  const total = d.reduce((s, x) => s + x[1], 0);
  graphes[id] = new Chart(document.getElementById(id), {type: vue === 'camembert' ? 'doughnut' : 'bar',
    data: {labels: d.map(x => x[0]), datasets: [{data: d.map(x => x[1]), backgroundColor: PALETTE}]},
    options: {indexAxis: 'y', plugins: {legend: {display: vue === 'camembert', position: 'bottom'},
      tooltip: {callbacks: {label: c => { const v = c.parsed.x ?? c.parsed; return ` ${eur(v)} (${Math.round(v / total * 100)} %)`; }}}}}});
}
function dessinerAnnee(annee) {
  if (graphes.gAnnee) graphes.gAnnee.destroy();
  const mois = Array.from({length: 12}, (_, i) => `${annee}-${String(i + 1).padStart(2, '0')}`);
  const visible = document.getElementById('selMois').value;
  const somme = (m, sg) => (DEMO && m !== visible) ? 0 : etat.operations.filter(o => o.date.startsWith(m) && Math.sign(o.montant) === sg).reduce((s, o) => s + Math.abs(o.montant), 0);

    data: {labels: mois.map(m => new Date(m + '-01').toLocaleDateString(LOCALE[etat.langue], {month:'short'})),
      datasets: [{label: t('revenus'), data: mois.map(m => somme(m, 1)), backgroundColor: '#34d399'}, {label: t('depenses'), data: mois.map(m => somme(m, -1)), backgroundColor: '#fb7185'}]}});

    const bas = d <= p ? `${t('reste')} ${eur(p - d)}` : `${t('depasse')} ${eur(d - p)}`;
    return `<div class="ligne-budget"><div class="haut"><b>${esc(c)}</b><span>${eur(d)} / ${eur(p)}</span></div><div class="barre"><div style="width:${Math.min(100, r * 100)}%;background:${coul}"></div></div><p class="petit">${bas}</p></div>`;
  }).join('') : `<p class="petit">${t('aucunBudget')}</p>`;

  }).join('') : `<p class="petit">${t('aucunObj')}</p>`;

function ouvrirReglages() { rendreCats(); document.getElementById('mReglages').classList.add('actif'); }
function fermer() { document.getElementById('mReglages').classList.remove('actif'); afficher(); }
function rendreCats() {
  document.getElementById('listeCat').innerHTML = etat.categories.map((c, i) => `<div style="padding:8px 0;border-bottom:1px solid #e2e8f0">
    <input type="checkbox" class="coche" value="${i}"> <input type="text" value="${esc(c.nom)}" class="${c.type}" style="font-weight:600;width:60%" onchange="renommer(${i}, this.value)">
    <span class="tag">${t(c.type)}</span><br>${c.mots.map(m => `<span class="tag">${esc(m)}</span>`).join('')}</div>`).join('');

function renommer(i, nom) {
  const ancien = etat.categories[i].nom; etat.categories[i].nom = nom;
  etat.operations.forEach(o => { if (o.cat === ancien) o.cat = nom; });
  if (etat.plafonds[ancien]) { etat.plafonds[nom] = etat.plafonds[ancien]; delete etat.plafonds[ancien]; }
  sauver();
}
async function fusionner() {
  const idx = [...document.querySelectorAll('.coche:checked')].map(c => +c.value), sel = idx.map(i => etat.categories[i]);
  if (sel.length < 2 || sel.some(c => c.type !== sel[0].type)) { message(t('choisir2')); return; }
  const nom = await boite(t('nomFusion'), true, sel[0].nom); if (!nom) return;
  const plafond = sel.reduce((s, c) => s + (etat.plafonds[c.nom] || 0), 0);
  sel.forEach(c => delete etat.plafonds[c.nom]); if (plafond > 0) etat.plafonds[nom] = plafond;
  const fusion = {nom, type: sel[0].type, mots: sel.flatMap(c => c.mots)};
  etat.categories = etat.categories.filter((_, i) => !idx.includes(i)); etat.categories.unshift(fusion);
  classerTout(); sauver(); rendreCats();
}

  etat.categories.unshift({nom, type: document.getElementById('nvType').value, mots: [nom.toUpperCase()]});
  document.getElementById('nvNom').value = ''; classerTout(); sauver(); rendreCats();
}
